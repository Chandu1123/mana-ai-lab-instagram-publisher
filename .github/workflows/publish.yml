name: Mana AI Lab daily publisher
on:
  push:
    paths:
      - '.github/workflows/publish.yml'
      - 'lessons.py'
      - 'publish.py'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Run mode
        options: [preview, publish]
        default: preview
  schedule:
    - cron: '30 4 * * *'
permissions:
  contents: write
concurrency:
  group: mana-instagram-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow requests
      - name: Render and check an example
        run: python publish.py --preview
      - name: Publish current campaign date
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish')
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
        run: |
          git config user.name 'Mana AI Lab publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python publish.py
